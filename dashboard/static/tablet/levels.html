<!doctype html>
<!--
  Pepper Tablet — Image-Card Menu  (menu_demo.html)
  ===================================================
  Shows a 2×2 grid of tappable image cards.  Each tap posts to
  /api/tablet_input so the robot can react immediately.

  URL parameters:
    ?title=What+shall+I+do%3F    Page heading  (default: "What can I help with?")
    ?subtitle=Pick+an+option     Subtitle line (default: "Tap a card to choose")
    ?color=#58a6ff               Accent colour override

  Payload sent on tap (POST /api/tablet_input):
    { "action": "card_choice", "value": "<label>", "index": <0-3> }

  Cards (fixed for the demo scenario):
    0  Weather     – ask about the weather
    1  Joke        – tell a joke
    2  News        – read a headline
    3  Dance       – perform a dance

  To use in a script:
    from HRI_lab_Pepper.dashboard.server import get_tablet_input
    inp = get_tablet_input()
    if inp and inp.get("action") == "card_choice":
        topic = inp["value"]   # "Weather" | "Joke" | "News" | "Dance"
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Level Selection</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      body {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .page {
        padding: 1.8rem 1.6rem 1.2rem;
        display: -webkit-flex;
        display: flex;
        -webkit-flex-direction: column;
        flex-direction: column;
        height: 100vh;
      }

      .card-grid {
        display: -webkit-flex;
        display: flex;
        -webkit-flex-wrap: wrap;
        flex-wrap: wrap;
        width: 100%;
      }

      .img-card {
        position: relative;
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        width: calc(50% - 1.2rem);
        margin: 0.6rem;
        height: 35vw;
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        border: 3px solid #333;
        background: #222;
        transition: all 0.15s;
        -webkit-tap-highlight-color: transparent;
      }

      .img-card:hover,
      .img-card:focus,
      .img-card.selected {
        border-color: #ffa500;
        box-shadow: 0 0 15px rgba(255, 165, 0, 0.6);
      }

      .img-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: brightness(0.8);
      }

      .card-label {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
        padding: 1rem 0.5rem;
        text-align: center;
      }

      .card-label span {
        font-size: 1.5rem;
        font-weight: 700;
        color: #fff;
      }

      /* Feedback Overlay */
      .feedback {
        position: fixed;
        inset: 0;
        display: -webkit-flex;
        display: flex;
        -webkit-align-items: center;
        align-items: center;
        -webkit-justify-content: center;
        justify-content: center;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.9);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s;
        z-index: 100;
      }
      .feedback.show {
        opacity: 1;
        pointer-events: all;
      }

      .picked-level {
        width: 60%;
        max-height: 60%;
        border-radius: 15px;
        border: 5px solid #ffa500; /* Orange border for the big image too */
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1 class="title" id="title-el">Pick a level</h1>
      <p class="subtitle" id="subtitle-el">Tap a card or speak to Pepper</p>
      <div class="card-grid" id="card-grid"></div>
    </div>

    <div class="feedback" id="feedback">
      <img src="" id="picked-level-img" class="picked-level" />
      <p
        class="feedback-text"
        id="fb-text"
        style="color: #ffa500; font-size: 2rem; font-weight: bold"
      ></p>
    </div>

    <script src="/libs/qimessaging/2/qimessaging.js"></script>
    <script>
      const CARDS = [
        { label: "Starter", img: "https://people.cs.umu.se/~id23sem/bridgegame_img/Beginner.jpg" },
        { label: "Junior", img: "https://people.cs.umu.se/~id23sem/bridgegame_img/Medium.jpg" },
        { label: "Expert", img: "https://people.cs.umu.se/~id23sem/bridgegame_img/Hard.jpg" },
        { label: "Master", img: "https://people.cs.umu.se/~id23sem/bridgegame_img/Master.jpg" },
      ];

      const grid = document.getElementById("card-grid");
      let tabletInputService = null;

      // Create cards
      CARDS.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "img-card";
        card.innerHTML = `
        <img src="${item.img}" onerror="this.src='https://via.placeholder.com/300?text=Missing+Image'">
        <div class="card-label"><span>${item.label}</span></div>
      `;
        card.onclick = () => handleChoice(idx, false);
        grid.appendChild(card);
      });

      function handleChoice(index, fromVoice) {
        const item = CARDS[index];
        const fb = document.getElementById("feedback");
        const fbImg = document.getElementById("picked-level-img");
        const fbText = document.getElementById("fb-text");

        // Highlight the card
        document
          .querySelectorAll(".img-card")
          .forEach((c) => c.classList.remove("selected"));
        document.querySelectorAll(".img-card")[index].classList.add("selected");

        // Update Feedback
        fbImg.src = item.img;
        fbText.textContent = "Level: " + item.label;
        fb.classList.add("show");

        // Notify Python if it was a touch
        if (!fromVoice && tabletInputService) {
          tabletInputService.notify(
            JSON.stringify({
              action: "card_choice",
              value: item.label,
              index: index,
            }),
          );
        }
      }

      // Connect to Pepper
      try {
        QiSession(function (session) {
          session.service("TabletInput").then((ti) => {
            tabletInputService = ti;
          });
          session.service("ALMemory").then((mem) => {
            mem.subscriber("BridgeGame/LevelSelected").then((sub) => {
              sub.signal.connect((idx) => handleChoice(idx, true));
            });
          });
        }, console.error);
      } catch (e) {}
    </script>
  </body>
</html>
