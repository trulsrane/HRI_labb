<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solution</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      body {
        background: #ffffff;
        color: rgb(0, 0, 0);
        text-align: center;
        overflow: hidden;
      }
      .page {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .level-sol-img {
        height: 70%;
        width: 70%;
        border-radius: 20px;
        border: 6px solid #ffa500;
        box-shadow: 0 0 20px rgba(255, 165, 0, 0.4);
      }
      .level-title {
        color: #ffa500;
        font-size: 3rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <img src="" id="display-img" class="level-sol-img" />
    </div>

    <script>
      // Read variables from the URL (?label=Starter&img=...)
      const params = new URLSearchParams(window.location.search);
      const img = params.get("img");

      if (img) document.getElementById("display-img").src = img;
    </script>
  </body>
</html>
